<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>What if domestic cats took over California?</title>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <div id="stage">
    <canvas id="gl"></canvas>
    <div id="overlay">
      <div id="title" class="panel"></div>
      <div id="stat" class="panel"><div class="num"></div><div class="lab"></div></div>
      <div id="day" class="panel"><div class="d"></div><div class="s"></div></div>
      <div id="legend" class="panel"></div>
      <div id="caption" class="panel"></div>
      <div id="endcard" class="panel"></div>
    </div>
    <div id="safe" hidden>
      <div class="zone top"></div><div class="zone bottom"></div><div class="zone right"></div>
      <div class="zlabel" style="top:4px;left:8px">top 8%</div>
      <div class="zlabel" style="bottom:4px;left:8px">bottom 20%</div>
      <div class="zlabel" style="top:50%;right:4px">right 12%</div>
    </div>
  </div>
  <script type="module" src="../../dist/cat-kingdom.js"></script>
</body>
</html>
