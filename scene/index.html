<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>What if California got 30 days of extreme rain?</title>
<style>
  /* Times New Roman stand-in, loaded from the project folder only */
  @font-face { font-family: "Video Serif"; src: url(/fonts/LiberationSerif-Regular.ttf) format("truetype"); font-weight: 400; font-style: normal; }
  @font-face { font-family: "Video Serif"; src: url(/fonts/LiberationSerif-Bold.ttf) format("truetype"); font-weight: 700; font-style: normal; }
  @font-face { font-family: "Video Serif"; src: url(/fonts/LiberationSerif-Italic.ttf) format("truetype"); font-weight: 400; font-style: italic; }
  @font-face { font-family: "Video Serif"; src: url(/fonts/LiberationSerif-BoldItalic.ttf) format("truetype"); font-weight: 700; font-style: italic; }

  :root {
    --text: #F3EFE6; --text2: #D2CBBF; --panel: rgba(24, 26, 30, 0.80); --edge: rgba(138, 132, 122, 0.35);
    --pad-x: 64px; --safe-right: 130px;
  }
  html, body { margin: 0; background: #0E1B2E; width: 1080px; height: 1920px; overflow: hidden; }
  * { box-sizing: border-box; font-family: "Video Serif", serif; font-variant-numeric: tabular-nums; }
  #stage { position: relative; width: 1080px; height: 1920px; }
  #gl { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
  #overlay { position: absolute; inset: 0; color: var(--text); pointer-events: none; }

  .panel { background: var(--panel); border: 1px solid var(--edge); border-radius: 22px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: 0 18px 50px rgba(0,0,0,0.35); }
  .word { display: inline-block; white-space: pre; will-change: transform, opacity; }

  #day { position: absolute; left: var(--pad-x); top: 170px; font-style: italic; font-size: 34px; line-height: 1.2; padding: 10px 22px; color: var(--text2); }
  #title { position: absolute; left: var(--pad-x); top: 250px; width: calc(1080px - var(--pad-x) - var(--safe-right)); padding: 26px 32px; font-weight: 700; font-size: 80px; line-height: 1.1; }
  #stat { position: absolute; left: var(--pad-x); top: 1138px; padding: 20px 34px 22px; min-width: 300px; }
  #stat .num { font-size: 72px; line-height: 1.1; }
  #stat .lab { font-size: 30px; line-height: 1.25; color: var(--text2); margin-top: 6px; max-width: 700px; }
  #caption { position: absolute; left: var(--pad-x); top: 1346px; width: calc(1080px - var(--pad-x) - var(--safe-right)); padding: 22px 30px 26px; font-size: 52px; line-height: 1.25; }
  #caption b, #stat b { font-weight: 700; }
  #legend { position: absolute; left: var(--pad-x); top: 250px; padding: 16px 26px; font-size: 28px; line-height: 1.3; color: var(--text2); }
  #legend .row { display: flex; align-items: center; gap: 14px; }
  #legend .sw { width: 34px; height: 20px; border-radius: 5px; flex: none; }
  #legend .tag { font-style: italic; font-size: 26px; margin-top: 4px; }
  #endcard { position: absolute; left: var(--pad-x); right: calc(var(--safe-right) + 16px); top: 560px; padding: 44px 48px; font-weight: 700; font-size: 80px; line-height: 1.1; text-align: left; }
  #endcard .sub { font-weight: 400; font-style: italic; font-size: 34px; line-height: 1.25; color: var(--text2); margin-top: 28px; }

  #safe { position: absolute; inset: 0; display: none; }
  #safe.on { display: block; }
  #safe div { position: absolute; background: rgba(224, 70, 70, 0.22); border: 2px dashed rgba(255, 120, 120, 0.8); }
  #safe .top { left: 0; top: 0; width: 1080px; height: 154px; }
  #safe .bottom { left: 0; top: 1536px; width: 1080px; height: 384px; }
  #safe .right { left: 950px; top: 154px; width: 130px; height: 1382px; }
  #safe span { position: absolute; left: 12px; bottom: 8px; font-size: 24px; color: #fff; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <div id="overlay">
    <div id="day" class="panel"></div>
    <div id="title" class="panel"></div>
    <div id="legend" class="panel"></div>
    <div id="stat" class="panel"><div class="num"></div><div class="lab"></div></div>
    <div id="caption" class="panel"></div>
    <div id="endcard" class="panel"></div>
    <div id="safe"><div class="top"><span>top 8 %</span></div><div class="bottom"><span>bottom 20 %</span></div><div class="right"><span>right 12 %</span></div></div>
  </div>
</div>
<script type="module" src="/scene/dist/bundle.js"></script>
</body>
</html>
