<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>What If 2008</title>
<style>
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: Inter, sans-serif; }
  #c { position: absolute; inset: 0; width: 1080px; height: 1920px; }
  .tag { display: inline-block; font-weight: 900; letter-spacing: 0.06em; border-radius: 10px; padding: 6px 14px; font-size: 24px; line-height: 1; }
  .gold { background: #ffc93c; color: #3a2a00; }
  .teal { background: #19c3b1; color: #00332e; }
  #title {
    position: absolute; left: 50px; right: 50px; top: 70px; padding: 26px 30px;
    background: rgba(20, 30, 70, 0.88); border-radius: 34px; color: #fff; text-align: center;
    font-weight: 900; font-size: 64px; line-height: 1.08; letter-spacing: -0.01em;
    box-shadow: 0 10px 0 rgba(0,0,0,0.18);
  }
  #title b { color: #ffc93c; }
  #stats {
    position: absolute; left: 50px; top: 330px; width: 680px; padding: 18px 22px;
    background: rgba(255, 255, 255, 0.93); border-radius: 24px; color: #1b2240;
    box-shadow: 0 8px 0 rgba(0,0,0,0.12); transform-origin: 0 0;
  }
  #stats .row { display: flex; align-items: center; gap: 14px; font-size: 29px; font-weight: 800; }
  #stats .row + .row { margin-top: 12px; }
  #stats .row span:last-child { flex: 1; }
  #stats .whatif span:last-child { font-style: italic; font-weight: 700; color: #0b6e64; }
  #badge { position: absolute; left: 50px; top: 490px; font-size: 22px; }
  #caption {
    position: absolute; left: 50px; right: 140px; top: 1270px; padding: 24px 28px 20px;
    background: rgba(255, 255, 255, 0.95); border-radius: 30px; color: #141a33;
    box-shadow: 0 10px 0 rgba(0,0,0,0.15); transform-origin: 50% 100%;
  }
  #capText { font-size: 46px; font-weight: 900; line-height: 1.15; margin-top: 12px; }
  #capSrc { font-size: 22px; font-weight: 600; color: #5a6385; margin-top: 10px; }
  #twist { margin-left: 10px; background: #ff5d8f; color: #fff; }
  #takeaway {
    position: absolute; left: 50px; right: 140px; top: 1090px; padding: 20px 26px;
    background: #ffc93c; color: #2a1f00; border-radius: 26px; font-weight: 900; font-size: 40px; line-height: 1.15;
    box-shadow: 0 8px 0 rgba(0,0,0,0.15); transform-origin: 50% 100%;
  }
  #sticker {
    position: absolute; left: 160px; right: 160px; top: 570px; padding: 18px 20px; text-align: center;
    background: #1d3557; color: #ffd166; border-radius: 26px; font-weight: 900; font-size: 50px;
    box-shadow: 0 8px 0 rgba(0,0,0,0.2);
  }
  #end {
    position: absolute; left: 50px; right: 50px; top: 1180px; padding: 34px 34px 28px; text-align: center;
    background: rgba(20, 30, 70, 0.92); color: #fff; border-radius: 36px; transform-origin: 50% 50%;
  }
  #endQ { font-size: 64px; font-weight: 900; line-height: 1.1; }
  #endQ .a { color: #c9a2ff; } #endQ .b { color: #ffb15c; }
  #endCta { font-size: 40px; font-weight: 800; margin-top: 20px; color: #ffc93c; }
  #endSrc { font-size: 22px; font-weight: 600; margin-top: 18px; color: #b9c2e8; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div id="title">What if the <b>2008 market crash</b> never happened?</div>
  <div id="stats">
    <div class="row real"><span class="tag gold">REAL HISTORY</span><span id="statReal"></span></div>
    <div class="row whatif"><span class="tag teal">WHAT IF</span><span id="statWhatIf"></span></div>
  </div>
  <div id="badge" class="tag teal">WHAT IF CITY · imagined</div>
  <div id="takeaway" class="hidden"></div>
  <div id="sticker" class="hidden">No crash ≠ cheap homes</div>
  <div id="caption">
    <span class="tag gold">REAL HISTORY</span><span id="twist" class="tag hidden">THE TWIST</span>
    <div id="capText"></div>
    <div id="capSrc"></div>
  </div>
  <div id="end" class="hidden">
    <div id="endQ"></div>
    <div id="endCta"></div>
    <div id="endSrc"></div>
  </div>
</div>
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js" } }</script>
<script type="module" src="./city.js"></script>
</body>
</html>
